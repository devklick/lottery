server {
  listen 80;

  location / {
    root /usr/share/nginx/html;
    # fall back to index since the UI uses React Router.
    try_files $uri /index.html;
  }

  # any requests to /lotteryapi get proxied to the api
  # the hostname `api` is defined in docker-compose, and  the api service 
  # listens on port 8080, also defined in docker-compose
  location /lotteryapi/ {
    proxy_pass http://api:8080/;
  }
}